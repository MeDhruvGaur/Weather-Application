<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Diary — Weather</title>
  <meta name="description" content="A weather app with a live animated sky that reflects real conditions." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/weather-icons.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#weatherPanel">Skip to weather</a>

  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1 class="wordmark">Sky <span>Diary</span></h1>
        <p class="tagline">A small, honest look at the sky wherever you are.</p>
      </div>

      <div class="controls">
        <div class="search-wrap">
          <form id="searchForm" class="search-form" role="search" autocomplete="off">
            <label for="searchInput" class="sr-only">Search for a city</label>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="Search a city…"
              aria-expanded="false"
              aria-controls="suggestions"
              role="combobox"
              aria-autocomplete="list"
            />
            <button type="submit" class="search-submit">Search</button>
          </form>
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <button id="locateBtn" type="button" class="icon-btn" aria-label="Use my current location">
          📍 My location
        </button>
        <button id="unitToggle" type="button" class="icon-btn" aria-label="Toggle temperature unit">
          °C
        </button>
      </div>
    </header>

    <span id="statusRegion" class="sr-only" role="status" aria-live="polite"></span>

    <main id="weatherPanel" class="weather-panel" aria-busy="false">
      <section class="scene" aria-label="Animated sky illustration for current conditions">
        <canvas id="sceneCanvas"></canvas>
        <div class="scene-overlay">
          <h2 id="cityName" class="city-name">Loading…</h2>
          <p id="cityMeta" class="city-meta"></p>
          <div class="temp-row">
            <span id="temp" class="temp">--°</span>
            <span id="condition" class="condition"></span>
          </div>
          <p id="updatedAt" class="updated-at"></p>
        </div>
      </section>

      <aside class="side-column">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Conditions</h3>
            <button id="favoriteBtn" type="button" class="favorite-btn" aria-pressed="false">
              ☆ Save city
            </button>
          </div>
          <div id="details" class="details-grid"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Saved cities</h3>
          </div>
          <div id="favorites" class="favorites-list"></div>
        </div>
      </aside>
    </main>

    <section class="forecast-section" aria-label="5-day forecast">
      <h2>Next 5 days</h2>
      <div id="forecast" class="forecast-strip"></div>
    </section>

    <footer class="app-footer">
      <p>Weather data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. No API key required.</p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/weatherService.js"></script>
  <script src="js/skyCanvas.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
